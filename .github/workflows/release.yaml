name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux
          - os: ubuntu-22.04-arm
            target: aarch64-linux
          - os: macos-15-intel
            target: x86_64-macos
          - os: macos-14
            target: aarch64-macos
          - os: windows-latest
            target: x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'

      - name: Build
        run: ghc -O2 --make Main.hs -o conv

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp conv dist/
          tar -czf conv-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist conv

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp conv.exe dist/
          cd dist && 7z a ../conv-${{ github.ref_name }}-${{ matrix.target }}.zip conv.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: conv-${{ matrix.target }}
          path: |
            conv-*.tar.gz
            conv-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
